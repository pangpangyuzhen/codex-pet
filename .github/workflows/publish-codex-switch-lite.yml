name: Publish Codex Switch Lite DMG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-codex-switch-lite.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download built DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: Codex-Switch-Lite-DMG
          path: /tmp/codex-switch-lite
          run-id: 33591202047
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit DMG to repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cp /tmp/codex-switch-lite/Codex-Switch-Lite-0.1.0-universal.dmg releases/Codex-Switch-Lite-0.1.0-universal.dmg
          git rm .github/workflows/publish-codex-switch-lite.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/Codex-Switch-Lite-0.1.0-universal.dmg
          git commit -m 'Add Codex Switch Lite 0.1.0 DMG'
          git push
